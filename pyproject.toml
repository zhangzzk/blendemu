[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blendemu"
version = "0.1.0"
description = "Blending simulation and emulation for weak-lensing analyses."
requires-python = ">=3.9"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "PyYAML",
    "scipy",
    "xgboost",
]

[project.optional-dependencies]
simulation = ["galsim", "ngmix"]

[tool.setuptools]
packages = ["blendemu"]
